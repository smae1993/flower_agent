name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  dart:
    name: Dart checks
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Install dependencies
        run: dart pub get

      - name: Check formatting
        run: |
          dart format .
          git diff --exit-code

      - name: Analyze
        run: dart analyze --fatal-infos

      - name: Run tests
        run: dart test packages/flower_core/test packages/flower_cli/test --reporter=expanded
